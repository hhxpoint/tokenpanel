<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TokenPanel · AI 用量面板</title>
<style>
  :root{
    --bg:#f6f5f2; --card:#fff; --line:#e7e4de; --text:#1d1c1a; --muted:#78756e;
    --shadow:0 1px 2px rgba(20,18,14,.04),0 8px 24px rgba(20,18,14,.04);
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1320px;margin:0 auto;padding:22px 24px 64px}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{font-size:19px;margin:0;letter-spacing:-.3px}
  .brand span{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  .seg{display:inline-flex;background:#efece6;border-radius:9px;padding:3px;gap:2px}
  .seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;
    padding:5px 11px;border-radius:7px;cursor:pointer;transition:.15s}
  .seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.07);font-weight:600}
  .btn{border:1px solid var(--line);background:#fff;color:var(--text);font:inherit;font-size:12.5px;
    padding:7px 13px;border-radius:9px;cursor:pointer}
  .btn:hover{border-color:#d5d0c6}
  .btn.busy{opacity:.55;pointer-events:none}

  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:15px 17px;box-shadow:var(--shadow)}
  .kpi .label{color:var(--muted);font-size:12px}
  .kpi .val{font-size:26px;font-weight:650;letter-spacing:-.8px;margin-top:5px;
    font-variant-numeric:tabular-nums}
  .kpi .sub{color:var(--muted);font-size:11.5px;margin-top:3px}
  .kpi .sub b{color:#3d3a35;font-weight:600}

  .ledger{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px;background:#fff;
    border:1px solid var(--line);border-radius:12px;padding:11px 16px;margin-bottom:14px;
    font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)}
  .ledger .main{color:var(--text);font-weight:650;font-size:13.5px}
  .ledger b{color:#3d3a35;font-weight:600;font-variant-numeric:tabular-nums}

  .grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:14px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:var(--shadow);min-width:0}
  .card h3{margin:0 0 2px;font-size:13.5px;font-weight:650}
  .card .hint{color:var(--muted);font-size:11.5px;margin-bottom:12px}
  .legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}

  svg{display:block;width:100%;height:auto;overflow:visible}
  .gridline{stroke:#eeebe5;stroke-width:1}
  .axis{fill:#9b978f;font-size:11px;font-variant-numeric:tabular-nums}
  .bar:hover{opacity:.72}

  .rank{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .rank-row{font-size:12.5px}
  .rank-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .rank-top .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#33312d}
  .rank-top .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;flex:none}
  .track{height:5px;background:#f1eee8;border-radius:3px;overflow:hidden;margin-top:5px}
  .track i{display:block;height:100%;border-radius:3px}

  .heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;justify-content:start}
  .cell{width:11px;height:11px;border-radius:3px;background:#f0eee9}
  .cell.l1{background:#f3dbd0}.cell.l2{background:#e8b098}
  .cell.l3{background:#d4805c}.cell.l4{background:#ad4f2d}.cell.l5{background:#7e3319}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:11.5px;
    padding:0 8px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:7px 8px;border-bottom:1px solid #f5f2ec;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:300px}
  tr:last-child td{border-bottom:0}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:1.5px 7px;border-radius:5px;font-size:11px;font-weight:600;color:#fff}
  .empty{color:var(--muted);font-size:12.5px;padding:20px 0;text-align:center}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:#faf0ea;border:1px solid #f0d8cb;color:#8a4526;border-radius:6px;
    padding:2px 8px;font-size:11px;font-family:ui-monospace,Consolas,monospace}
  .bar-ctx{height:5px;background:#f1eee8;border-radius:3px;overflow:hidden;margin-top:5px}
  .bar-ctx i{display:block;height:100%;background:#7c6bf5;border-radius:3px}
  .src{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;
    padding:6px 0;border-bottom:1px solid #f5f2ec}
  .src:last-child{border-bottom:0}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px}
  footer{color:var(--muted);font-size:11.5px;margin-top:20px;display:flex;gap:18px;flex-wrap:wrap}
  .err{color:#a8422a;font-size:11.5px;margin-top:6px;word-break:break-all}

  @media (max-width:900px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:1fr}
    .wrap{padding:16px 14px 48px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>TokenPanel</h1><span id="rangeLabel">近 7 天</span></div>
    <div class="spacer"></div>
    <div class="seg" id="rangeSeg">
      <button data-days="7" class="on">7 天</button>
      <button data-days="30">30 天</button>
      <button data-days="90">90 天</button>
      <button data-days="365">1 年</button>
      <button data-days="0">全部</button>
    </div>
    <div class="seg" id="modeSeg">
      <button data-mode="tokens" class="on">Token</button>
      <button data-mode="cost">成本</button>
    </div>
    <button class="btn" id="refresh">重新扫描</button>
  </header>

  <section class="kpis" id="kpis"></section>
  <div class="ledger" id="ledger"></div>

  <div class="grid">
    <div class="card">
      <h3>每日用量趋势</h3>
      <div class="hint" id="trendHint">按客户端堆叠</div>
      <svg id="trendChart" viewBox="0 0 1000 280" preserveAspectRatio="none" role="img"></svg>
      <div class="legend" id="legend"></div>
    </div>
    <div class="card">
      <h3>客户端占比</h3>
      <div class="hint">所选区间内</div>
      <div class="rank" id="share"></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>近 90 天活跃度</h3>
      <div class="hint">颜色越深，当日 token 消耗越高</div>
      <div class="legend" style="margin:0 0 10px">
        <span>少</span><span class="cell l1" style="width:10px;height:10px"></span>
        <span class="cell l3" style="width:10px;height:10px"></span>
        <span class="cell l5" style="width:10px;height:10px"></span><span>多</span>
      </div>
      <div class="heat" id="heat"></div>
      <div id="heatStats" style="display:flex;gap:26px;margin-top:16px"></div>
    </div>
    <div class="card">
      <h3>WorkBuddy 计费快照</h3>
      <div class="hint">会话级快照，credit 不可跨会话累加</div>
      <div id="wb"></div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3>模型用量</h3>
      <div class="hint">按 token 总量排序</div>
      <table><thead><tr><th>客户端</th><th>模型</th><th class="num">调用</th><th class="num">Token</th><th class="num">成本</th></tr></thead><tbody id="modelBody"></tbody></table>
    </div>
    <div class="card">
      <h3>项目用量</h3>
      <div class="hint">Top 10</div>
      <div class="rank" id="projects"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:14px">
    <h3>最近会话</h3>
    <div class="hint">按最近活动排序，最多 40 条</div>
    <table><thead><tr><th>客户端</th><th>项目</th><th>模型</th><th class="num">调用</th><th class="num">Token</th><th class="num">成本</th><th>最近活动</th></tr></thead><tbody id="sessionBody"></tbody></table>
  </div>

  <div class="card">
    <h3>数据源状态</h3>
    <div class="hint">未定价模型只统计 token，不计入金额</div>
    <div id="health"></div>
  </div>

  <footer>
    <span>数据全部来自本机日志，不外发</span>
    <span id="dbPath"></span>
  </footer>
</div>

<script>
const COLORS = {claude:"#d97757", dsh:"#4d6bfe", opencode:"#2ea043", codex:"#10a37f", workbuddy:"#7c6bf5"};
const FALLBACK = ["#8b8fe8","#e0a458","#5fa8a0","#b9799b","#8a9a5b"];
const NAMES = {claude:"Claude Code", dsh:"dsh", opencode:"OpenCode", codex:"Codex", workbuddy:"WorkBuddy"};
const state = {days:7, mode:"tokens"};

const $ = s => document.querySelector(s);
const ESC = {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ESC[c]);

function fmt(n){
  n = Number(n) || 0;
  const a = Math.abs(n);
  if (a < 10000) return Math.round(n).toLocaleString("en-US");
  if (a < 1e8){ const v = n/1e4; return (Math.abs(v) < 100 ? v.toFixed(2) : v.toFixed(1)) + "万"; }
  if (a < 1e12) return (n/1e8).toFixed(2) + "亿";
  return (n/1e12).toFixed(2) + "万亿";
}
function usd(v){
  if (v === null || v === undefined) return "—";
  const n = Number(v);
  if (n === 0) return "$0";
  if (n < 0.01) return "$" + n.toFixed(4);
  return "$" + n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
}
const colorOf = (c,i) => COLORS[c] || FALLBACK[i % FALLBACK.length];
const nameOf = c => NAMES[c] || c;
function timeStr(ms){
  if (!ms) return "—";
  const d = new Date(ms), diff = Date.now() - ms;
  const hm = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  if (diff < 86400000) return "今天 " + hm;
  if (diff < 172800000) return "昨天 " + hm;
  return (d.getMonth()+1)+"-"+String(d.getDate()).padStart(2,"0")+" "+hm;
}
const metric = (tokens,cost) => state.mode === "cost" ? (cost || 0) : (tokens || 0);
async function getJSON(url){ const r = await fetch(url); if(!r.ok) throw new Error(url+" "+r.status); return r.json(); }

/* ---------- 总账 ---------- */
function renderLedger(o){
  $("#ledger").innerHTML =
    `<span class="main">总计 ${fmt(o.tokens)} tokens</span>` +
    `<span>输入 <b>${fmt(o.input)}</b></span>` +
    `<span>输出 <b>${fmt(o.output)}</b></span>` +
    `<span>缓存读 <b>${fmt(o.cache_read)}</b></span>` +
    `<span>缓存写 <b>${fmt(o.cache_write)}</b></span>` +
    `<span>推理 <b>${fmt(o.reasoning)}</b></span>` +
    `<span>调用 <b>${(o.calls||0).toLocaleString()}</b> 次</span>`;
}

/* ---------- KPI ---------- */
function renderKpis(o){
  const cachePct = ((o.cache_hit||0)*100).toFixed(1);
  const avg = o.calls ? Math.round(((o.input||0)+(o.output||0))/o.calls) : 0;
  const main = state.mode === "cost" ? usd(o.cost) : fmt(o.tokens);
  const cards = [
    ["总"+(state.mode==="cost"?"成本":"Token"), main, (o.calls||0).toLocaleString()+" 次调用"],
    ["缓存命中率", cachePct+"%", "缓存读 <b>"+fmt(o.cache_read)+"</b> / 新输入 "+fmt(o.input)],
    ["平均有效 token/次", fmt(avg), "输出 "+fmt(o.output)+(o.reasoning ? " · 推理 "+fmt(o.reasoning) : "")],
    ["活跃情况", (o.active_days||0)+" 天", "<b>"+(o.clients||0)+"</b> 个客户端 · <b>"+(o.projects||0)+"</b> 个项目"]
  ];
  $("#kpis").innerHTML = cards.map(([l,v,s]) =>
    `<div class="kpi"><div class="label">${l}</div><div class="val">${v}</div><div class="sub">${s}</div></div>`).join("");
}

/* ---------- 趋势 ---------- */
function renderTrend(t){
  const svg = $("#trendChart");
  const clients = Object.keys(t.series).sort();
  const labels = clients.length ? t.series[clients[0]].labels : [];
  $("#legend").innerHTML = clients.map((c,i)=>
    `<span><i style="background:${colorOf(c,i)}"></i>${esc(nameOf(c))}</span>`).join("");

  if (!labels.length){
    svg.innerHTML = `<text x="500" y="145" text-anchor="middle" class="axis">暂无数据</text>`;
    return;
  }
  const W=1000,H=280,L=72,R=14,T=14,B=30, iw=W-L-R, ih=H-T-B;
  const totals = labels.map((_,i)=>clients.reduce((s,c)=>
    s+metric(t.series[c].tokens[i], t.series[c].cost[i]),0));
  const maxV = Math.max(...totals, 1);
  const step = iw/labels.length;
  const bw = Math.max(2, Math.min(34, step*0.62));
  let out = "";
  for (let k=0;k<=4;k++){
    const y = T+ih-(ih*k/4), v = maxV*k/4;
    out += `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" class="gridline"/>`;
    out += `<text x="${L-9}" y="${y+3.5}" text-anchor="end" class="axis">${state.mode==="cost"?usd(v):fmt(v)}</text>`;
  }
  const every = Math.ceil(labels.length/9);
  labels.forEach((lb,i)=>{
    if (i % every) return;
    out += `<text x="${L+step*i+step/2}" y="${H-9}" text-anchor="middle" class="axis">${esc(lb)}</text>`;
  });
  labels.forEach((lb,i)=>{
    let y = T+ih;
    clients.forEach((c,ci)=>{
      const v = metric(t.series[c].tokens[i], t.series[c].cost[i]);
      if (v <= 0) return;
      const h = v/maxV*ih;
      y -= h;
      out += `<rect class="bar" x="${L+step*i+(step-bw)/2}" y="${y}" width="${bw}" height="${h}"
        fill="${colorOf(c,ci)}" rx="2"><title>${esc(nameOf(c))} · ${esc(lb)}&#10;${state.mode==="cost"?usd(v):fmt(v)+" tokens"}</title></rect>`;
    });
  });
  svg.innerHTML = out;
}

/* ---------- 客户端占比 ---------- */
function renderShare(o){
  const rows = [...(o.by_client||[])].sort((a,b)=>metric(b.tokens,b.cost)-metric(a.tokens,a.cost));
  const total = rows.reduce((s,r)=>s+metric(r.tokens,r.cost),0) || 1;
  if (!rows.length){ $("#share").innerHTML = `<div class="empty">暂无数据</div>`; return; }
  $("#share").innerHTML = rows.map((r,i)=>{
    const v = metric(r.tokens,r.cost), pct = v/total*100;
    return `<div class="rank-row">
      <div class="rank-top"><span class="name">${esc(nameOf(r.client))}</span>
        <span class="num">${state.mode==="cost"?usd(r.cost):fmt(r.tokens)} · ${pct.toFixed(1)}%</span></div>
      <div class="track"><i style="width:${pct.toFixed(2)}%;background:${colorOf(r.client,i)}"></i></div>
    </div>`;
  }).join("");
}

/* ---------- 热力图 ---------- */
function renderHeat(t){
  const map = {};
  (t.days || []).forEach(d => { map[d] = 0; });
  Object.values(t.series).forEach(s=>{
    s.labels.forEach((_,i)=>{
      const d = t.days && t.days[i];
      if (d !== undefined) map[d] = (map[d]||0) + s.tokens[i];
    });
  });
  // 固定铺满最近 91 天（13 周 × 7 天），空缺显示为空格外，避免图表忽长忽短
  const today = Math.floor(Date.now() / 86400000);
  const span = 91;
  const keys = [];
  for (let i = span - 1; i >= 0; i--) keys.push(today - i);
  const vals = keys.map(k => map[k] || 0);
  const max = Math.max(...vals, 1);
  const q = [0.12,0.3,0.55,0.8].map(p=>max*p);
  $("#heat").innerHTML = keys.map((k,i)=>{
    const v = vals[i];
    let lv = v>0 ? 1 : 0;
    if (v>q[0]) lv=2; if (v>q[1]) lv=3; if (v>q[2]) lv=4; if (v>q[3]) lv=5;
    const label = new Date(k*86400000).toISOString().slice(5,10);
    return `<div class="cell l${lv}" title="${label} · ${fmt(v)}"></div>`;
  }).join("");

  const active = vals.filter(v => v > 0);
  const peak = Math.max(...vals, 0);
  const avg = active.length ? active.reduce((a,b)=>a+b,0) / active.length : 0;
  const stat = (label, value) =>
    `<div><div style="font-size:11.5px;color:var(--muted)">${label}</div>
      <div style="font-size:16px;font-weight:650;font-variant-numeric:tabular-nums">${value}</div></div>`;
  $("#heatStats").innerHTML =
    stat("活跃天数（90 天）", active.length + " / 90") +
    stat("日均（活跃日）", fmt(avg)) +
    stat("单日峰值", fmt(peak));
}

/* ---------- 模型表 ---------- */
function renderModels(rows){
  const body = $("#modelBody");
  if (!rows.length){ body.innerHTML = `<tr><td colspan="5" class="empty">暂无数据</td></tr>`; return; }
  const maxCost = Math.max(...rows.map(r=>r.tokens||0), 1);
  body.innerHTML = rows.slice(0,12).map(r=>`<tr>
    <td><span class="dot" style="background:${colorOf(r.client)}"></span>${esc(nameOf(r.client))}</td>
    <td title="${esc(r.model)}">${esc(r.model)}</td>
    <td class="num">${(r.calls||0).toLocaleString()}</td>
    <td class="num">${fmt(r.tokens)}</td>
    <td class="num">${usd(r.cost)}</td></tr>`).join("");
}

/* ---------- 项目 ---------- */
function renderProjects(rows){
  const el = $("#projects");
  if (!rows.length){ el.innerHTML = `<div class="empty">暂无数据</div>`; return; }
  const max = Math.max(...rows.map(r=>r.tokens||0), 1);
  el.innerHTML = rows.slice(0,10).map(r=>{
    const pct = (r.tokens||0)/max*100;
    return `<div class="rank-row">
      <div class="rank-top"><span class="name" title="${esc(r.project)}">${esc(shortName(r.project))}</span>
        <span class="num">${fmt(r.tokens)} · ${usd(r.cost)}</span></div>
      <div class="track"><i style="width:${pct.toFixed(2)}%;background:${colorOf(r.client)}"></i></div>
    </div>`;
  }).join("");
}
function shortName(p){
  if (!p) return "未知";
  const parts = String(p).split("/");
  return parts.length > 2 ? "…/"+parts.slice(-2).join("/") : String(p);
}

/* ---------- 会话 ---------- */
function renderSessions(rows){
  const body = $("#sessionBody");
  if (!rows.length){ body.innerHTML = `<tr><td colspan="7" class="empty">暂无数据</td></tr>`; return; }
  body.innerHTML = rows.map(r=>`<tr>
    <td><span class="dot" style="background:${colorOf(r.client)}"></span>${esc(nameOf(r.client))}</td>
    <td title="${esc(r.project)}">${esc(shortName(r.project))}</td>
    <td title="${esc(r.model)}">${esc(r.model || "—")}</td>
    <td class="num">${(r.calls||0).toLocaleString()}</td>
    <td class="num">${fmt(r.tokens)}</td>
    <td class="num">${usd(r.cost)}</td>
    <td>${timeStr(r.end_ts)}</td></tr>`).join("");
}

/* ---------- WorkBuddy ---------- */
function renderWB(rows){
  const el = $("#wb");
  if (!rows.length){ el.innerHTML = `<div class="empty">本机没有 WorkBuddy 会话记录</div>`; return; }
  const total = rows.reduce((s,r)=>s+(r.credits||0),0);
  const head = `<div style="display:flex;gap:22px;margin-bottom:12px">
      <div><div style="font-size:11.5px;color:var(--muted)">会话数</div>
        <div style="font-size:22px;font-weight:650;font-variant-numeric:tabular-nums">${rows.length}</div></div>
      <div><div style="font-size:11.5px;color:var(--muted)">credit 合计</div>
        <div style="font-size:22px;font-weight:650;font-variant-numeric:tabular-nums">${total.toLocaleString("en-US",{maximumFractionDigits:1})}</div></div>
    </div>`;
  const list = rows.slice(0,6).map(r=>{
    const pct = r.size ? Math.min(100, (r.used||0)/r.size*100) : 0;
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;gap:8px">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(shortName(r.project))}</span>
        <span style="color:var(--muted);flex:none">${fmt(r.used)} / ${fmt(r.size)}</span></div>
      <div class="bar-ctx"><i style="width:${pct.toFixed(1)}%"></i></div>
    </div>`;
  }).join("");
  el.innerHTML = head + list;
}

/* ---------- 数据源 ---------- */
function renderHealth(h){
  const el = $("#health");
  const rows = h.sources.map(s=>{
    const ok = s.ts && (Date.now()/1000 - s.ts < 86400*7);
    return `<div class="src"><span><span class="dot" style="background:${ok?"#2ea043":"#c9a227"}"></span>${esc(nameOf(s.client))}</span>
      <span style="color:var(--muted)">${s.events||0} 条事件 · 最近扫描 ${timeStr((s.ts||0)*1000)}</span></div>`;
  }).join("");
  const unpriced = h.unpriced_models.length
    ? `<div style="margin-top:12px;font-size:12px;color:var(--muted)">未定价模型（金额显示为 —）：
        <div class="chips">${h.unpriced_models.map(m=>`<span class="chip">${esc(m)}</span>`).join("")}</div></div>`
    : "";
  const errors = h.recent_errors.length
    ? `<div class="err">最近告警：${h.recent_errors.map(e=>esc(e.client+": "+e.errors)).join("；")}</div>` : "";
  el.innerHTML = (rows || `<div class="empty">尚未扫描</div>`) + unpriced + errors;
  // 只显示相对位置，避免把本机绝对路径带到截图或分享里
  const p = String(h.config.db || "").replace(/\\/g, "/");
  $("#dbPath").textContent = "数据库 " + p.split("/").slice(-2).join("/");
}

/* ---------- 加载 ---------- */
async function load(){
  const d = state.days;
  $("#rangeLabel").textContent = d === 0 ? "全部时间" : `近 ${d} 天`;
  try{
    const [ov, tr, tr90, md, pj, ss, cr, hl] = await Promise.all([
      getJSON(`/api/overview?days=${d}`),
      getJSON(`/api/trend?days=${d}`),
      getJSON(`/api/trend?days=90`),
      getJSON(`/api/models?days=${d}`),
      getJSON(`/api/projects?days=${d}`),
      getJSON(`/api/sessions?days=${d}`),
      getJSON(`/api/credits`),
      getJSON(`/api/health`)
    ]);
    renderKpis(ov); renderLedger(ov); renderTrend(tr); renderShare(ov);
    renderHeat(tr90); renderModels(md); renderProjects(pj);
    renderSessions(ss); renderWB(cr); renderHealth(hl);
  }catch(e){
    $("#kpis").innerHTML = `<div class="kpi" style="grid-column:1/-1;color:#a8422a">
      加载失败：${esc(e.message)}。请确认服务在运行。</div>`;
  }
}

/* ---------- 交互 ---------- */
$("#rangeSeg").addEventListener("click", e=>{
  const b = e.target.closest("button[data-days]"); if(!b) return;
  state.days = Number(b.dataset.days);
  [...$("#rangeSeg").children].forEach(x=>x.classList.toggle("on", x===b));
  load();
});
$("#modeSeg").addEventListener("click", e=>{
  const b = e.target.closest("button[data-mode]"); if(!b) return;
  state.mode = b.dataset.mode;
  [...$("#modeSeg").children].forEach(x=>x.classList.toggle("on", x===b));
  load();
});
$("#refresh").addEventListener("click", async e=>{
  const btn = e.currentTarget;
  btn.classList.add("busy"); btn.textContent = "扫描中…";
  try{ await fetch("/api/scan", {method:"POST"}); }catch(_){}
  btn.classList.remove("busy"); btn.textContent = "重新扫描";
  load();
});

load();
</script>
</body>
</html>
