<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · TokenPanel</title>
<style>
  :root{--bg:#fafaf8;--text:#1a1917;--muted:#8a857e;--line:rgba(24,22,19,.09)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
    color:var(--text);padding:24px;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  .box{text-align:center;max-width:420px}
  .code{font-size:64px;font-weight:700;letter-spacing:-3px;color:#e8e4dc;line-height:1}
  h1{font-size:19px;margin:14px 0 8px;letter-spacing:-.4px}
  p{color:var(--muted);font-size:13.5px;margin:0 0 22px}
  a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#fff;
    background:linear-gradient(180deg,#e2622f,#cf4c24);font-size:14px;font-weight:600;
    padding:11px 22px;border-radius:11px;
    box-shadow:0 2px 4px rgba(184,64,28,.22), 0 10px 22px -10px rgba(184,64,28,.45)}
  a:hover{filter:brightness(1.05)}
  .mark{width:34px;height:34px;border-radius:9px;margin:0 auto 18px;
    background:linear-gradient(145deg,#e2622f,#b8401c);display:grid;place-items:center;
    box-shadow:0 2px 6px -1px rgba(184,64,28,.4), inset 0 1px 0 rgba(255,255,255,.28)}
  .mark svg{width:17px;height:17px}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
        <path d="M5 19V11M12 19V5M19 19v-5"/>
      </svg>
    </div>
    <div class="code">404</div>
    <h1>这个页面不存在</h1>
    <p>链接可能已失效，或者地址打错了。</p>
    <a href="/tokenpanel/">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m14 6-6 6 6 6"/>
      </svg>
      回到首页
    </a>
  </div>
</body>
</html>
