name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时只跑最后一次，省额度也省时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        run: python -m ruff check tokenpanel tests launch.py

      - name: mypy
        run: python -m mypy tokenpanel

  test:
    name: Test (${{ matrix.os }} · Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest with coverage
        run: python -m pytest --cov=tokenpanel --cov-report=term-missing

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          if-no-files-found: ignore

  selftest:
    name: Self-test (${{ matrix.os }} · Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q tokenpanel launch.py

      - name: Self-test
        run: python -m tokenpanel selftest

      - name: Report environment
        if: always()
        continue-on-error: true
        run: python -m tokenpanel doctor

  build:
    name: Build Windows exe
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name TokenPanel `
            --icon "assets\icon.ico" `
            --add-data "tokenpanel\web;tokenpanel\web" `
            --add-data "pricing.json;." `
            --add-data "catalog.json;." `
            launch.py

      - name: Checksum
        run: |
          python -c "import hashlib,pathlib;p=pathlib.Path('dist/TokenPanel.exe');h=hashlib.sha256(p.read_bytes()).hexdigest();pathlib.Path('SHA256SUMS.txt').write_text(f'{h}  TokenPanel.exe\n',encoding='utf-8');print(h)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenPanel-exe
          path: |
            dist/TokenPanel.exe
            SHA256SUMS.txt
            verify.bat
